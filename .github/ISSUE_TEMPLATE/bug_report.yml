name: Bug report
description: Report a reproducible defect without sensitive audio or data
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include vulnerabilities, credentials, recordings, transcripts, evidence, personal data, biometric data, or production data. Use synthetic fixtures and the private security-reporting process when appropriate.
  - type: input
    id: repository
    attributes:
      label: Affected repository
      placeholder: sonus-auris/repository
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Version, tag, branch, or commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe the observed behavior and impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps using synthetic data
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, device, permissions, runtime, deployment target, relevant configuration, and sanitized logs.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, recordings, transcripts, evidence, personal data, biometric data, and production data.
          required: true
        - label: I did not use destructive commands to create this report.
          required: true
