name: Bug report
description: Report a reproducible defect without sensitive audio or data
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include vulnerabilities, credentials, recordings, transcripts, evidence, personal data, biometric data, or production data. Use synthetic fixtures and the private security-reporting process when appropriate.
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: This is not a security vulnerability; security reports follow SECURITY.md.
          required: true
  - type: input
    id: repository
    attributes:
      label: Affected repository
      placeholder: sonus-auris/repository
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Version, tag, branch, or commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe the observed behavior and impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction using synthetic data
      description: Provide deterministic steps and the smallest safe example.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and diagnostics
      description: Include OS, device, permissions, runtime, deployment target, relevant configuration, and sanitized logs.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, recordings, transcripts, evidence, personal data, biometric data, and production data.
          required: true
        - label: I did not use destructive commands to create this report.
          required: true
