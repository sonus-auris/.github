name: Agent policy reusable check

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonus-auris-agent-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-agent-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify required agent-safety declarations
        shell: bash
        run: |
          set -euo pipefail

          for path in agents.md AGENTS.md; do
            if [[ ! -f "$path" ]]; then
              echo "::error file=$path::Missing required agent policy file. Mirror the organization policy from sonus-auris/.github."
              exit 1
            fi
          done

          lowercase_required=(
            "avoid git rebase in favor of git merge"
            "git stash"
            "git reset"
            "git clean"
            "git filter-repo"
            "3–10 relevant commits"
            "Never report"
          )
          for phrase in "${lowercase_required[@]}"; do
            if ! grep -Fq "$phrase" agents.md; then
              echo "::error file=agents.md::Missing required policy phrase: $phrase"
              exit 1
            fi
          done

          uppercase_required=(
            "semantic conflict"
            "3 and up to 10"
            "git stash"
            "git reset"
            "git clean"
            "git filter-repo"
            "destructive"
          )
          for phrase in "${uppercase_required[@]}"; do
            if ! grep -Fqi "$phrase" AGENTS.md; then
              echo "::error file=AGENTS.md::Missing required policy phrase: $phrase"
              exit 1
            fi
          done

          echo "Agent policy baseline is present."

      - name: Validate policy, workflow pins, conflict markers, and credential patterns
        shell: bash
        run: bash scripts/validate-agent-policy.sh

      - name: Exercise fail-closed validator fixtures
        shell: bash
        run: bash tests/agent-policy-validator.sh
