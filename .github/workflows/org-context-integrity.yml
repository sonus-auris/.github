name: Organization context integrity

on:
  pull_request:
    paths:
      - .github/workflows/org-context-integrity.yml
      - README.md
      - agents/org-context.agent.md
      - org-context-manifest.json
      - profile/README.md
      - project-context.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/org-context-integrity.yml
      - README.md
      - agents/org-context.agent.md
      - org-context-manifest.json
      - profile/README.md
      - project-context.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/org-context-integrity.yml

      - name: Verify immutable central source and composed bundle
        shell: bash
        env:
          EXPECTED_OWNER: "sonus-auris"
          REGISTRY_REF: "d3e03ecc2e175a7f6261523d35c73ac775c49942"
          REGISTRY_REPOSITORY: "ORESoftware/ai-agent-coordinator.rs"
        run: |
          set -euo pipefail
          context_tmp="$(mktemp -d)"
          raw_base="https://raw.githubusercontent.com/$REGISTRY_REPOSITORY/$REGISTRY_REF"
          mkdir -p "$context_tmp/config" "$context_tmp/scripts"
          for relative_file in \
            config/org-project-registry.yaml \
            scripts/validate_org_project_registry.py; do
            curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              "$raw_base/$relative_file" --output "$context_tmp/$relative_file"
          done
          python3 - \
            "$context_tmp/config/org-project-registry.yaml" \
            "$context_tmp/scripts" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          registry_path = Path(sys.argv[1])
          sys.path.insert(0, sys.argv[2])
          from validate_org_project_registry import (  # noqa: E402
              canonical_sha256,
              load_registry,
              validate_registry,
          )

          root = Path.cwd().resolve()
          context = json.loads((root / "project-context.yaml").read_text())
          manifest = json.loads((root / "org-context-manifest.json").read_text())
          source = context["derived_from"]

          assert context["github"]["login"] == os.environ["EXPECTED_OWNER"]
          assert source["repository"] == os.environ["REGISTRY_REPOSITORY"]
          assert source["ref"] == os.environ["REGISTRY_REF"]
          assert source["immutable"] is True
          assert manifest["github_owner"] == os.environ["EXPECTED_OWNER"]
          assert manifest["registry_ref"] == os.environ["REGISTRY_REF"]

          registry = load_registry(registry_path)
          validate_registry(registry)
          registry_hash = canonical_sha256(registry)
          assert registry_hash == source["canonical_sha256"]
          assert registry_hash == manifest["registry_sha256"]

          for relative_path, expected_hash in manifest["files"].items():
              candidate = (root / relative_path).resolve()
              assert candidate == root or root in candidate.parents
              assert candidate.is_file(), f"missing managed file: {relative_path}"
              actual_hash = hashlib.sha256(candidate.read_bytes()).hexdigest()
              assert actual_hash == expected_hash, (
                  f"checksum mismatch for {relative_path}: "
                  f"expected {expected_hash}, got {actual_hash}"
              )
          PY
